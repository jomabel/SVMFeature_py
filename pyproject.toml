[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "svmfsmeta"
version = "0.1.0"
description = "Multiobjective SVM feature selection via metaheuristics"
readme = "README.md"
authors = [
    { name = "José Manuel Martínez Belando"},
    { name = "Antonio Jesús Banegas Luna"},
    { name = "Daniel Valero Carreras" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.1.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.2",
    "plotly",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["nsga2_svm_fs*"] <--- ¿Esto se cambia????

