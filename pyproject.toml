[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nsga2_svm_fs"
version = "0.1.0"
description = "NSGA-II for feature selection using SVM"
readme = "README.md"
authors = [
    { name = "José Manuel Martínez Belando"},
    { name = "Antonio Jesús Banegas"},
    { name = "Daniel Valero" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.1.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.2",
    "plotly",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["nsga2_svm_fs*"]

